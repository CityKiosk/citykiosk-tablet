<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Souvenirs Berlin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#0f172a}
@media(prefers-color-scheme:dark){body{background:#020617;color:#f1f5f9}}
.c{text-align:center;padding:2rem}
img{width:80px;height:80px;margin-bottom:1.5rem;animation:pulse 2s ease-in-out infinite}
h1{font-size:1.25rem;font-weight:600;margin-bottom:.5rem}
p{font-size:.875rem;color:#64748b}
@media(prefers-color-scheme:dark){p{color:#94a3b8}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#0369a1;margin:0 3px;animation:bounce 1.4s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.dots{margin-top:1.5rem}
</style>
</head>
<body>
<div class="c">
<img src="/logo-192.png" alt="Souvenirs Berlin">
<h1>Souvenirs Berlin</h1>
<p>Wird geladen... / Yükleniyor...</p>
<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
<script>setTimeout(()=>location.reload(),5000)</script>
</body>
</html>
